<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if else 문</title>
</head>

<body>
  <script>
    /*
      1. prompt로 숫자 두 개를 입력받기
      2. 첫 번째 숫자가 두 번째 숫자보다 크면
         "첫번째 숫자가 크군요"
      3. 그렇지 않으면
         "첫번째 숫자가 두번째 숫자보다 작거나 같군요"
      4. result 변수를 document.write()로 출력
    */

    let num1 = Number(prompt('첫 번째 숫자를 입력하세요', '0'));
    let num2 = Number(prompt('두 번째 숫자를 입력하세요', '0'));
    let result;

    if (num1 > num2) {
      result = '첫번째 숫자가 크군요';
    } else {
      result = '첫번째 숫자가 두번째 숫자보다 작거나 같군요';
    }
    document.write(result);
  </script>
</body>

</html>
