<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    ul {
      list-style: none;
      width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }

    ul li {
      width: 200px;
      height: 150px;
      overflow: hidden;
   
    }

    ul li a {
      display: block;
      width: 100%;
      height: 100%;
    }

    ul li a img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .5s;
    }

    ul li:hover a img {
      transform: scale(1.2);

    }
  </style>
</head>

<body>
  <ul>
    <li><a href=""><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS43pqpJPTUpxqfCmXpB7FMtg0H7MYQfMIckKlHi89l2Q&s=10"
          alt="리센느원이"></a></li>
    <li><a href=""><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpRVn-vUhd9rFf2JOJKby9v10FrOWEYi9U2Fhr4HNWmg&s=10"
          alt="리센느원이"></a></li>
    <li><a href=""><img

          alt="리센느원이"></a></li>
  </ul>
</body>

</html>
