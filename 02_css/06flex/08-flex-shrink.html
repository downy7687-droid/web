<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="default.css">

  <title>flex-shrink</title>

  <style>
    .flex_container {
      display: flex;
      width: 80%;
      margin: 0 auto;
    }

    .flex_item {
      width: 400px;
      height: 100px;
    }

    /* flex-shrink는 flex-grow와 쌍을 이루는 속성
        flex-basis의 값보다 작아질 수 있는지를 결정하는 속성
        일단 0보다 큰 값이 세팅이 되면 해당 아이템이 flex-basis보다 작아 집니다.
        기본값이 1이기 때문에 따로 세팅하지 않아도 작아짐
        */
  </style>

</head>

<body>
  <div class="flex_container">
    <div class="flex_item">a</div>
    <div class="flex_item">b</div>
    <div class="flex_item">v</div>
  </div>
</body>

</html>
