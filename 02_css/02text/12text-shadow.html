<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text-shadow</title>
  <style>
    .ex {
      margin-top: 100px;
      border: 1px solid #ccc;

    }

    .s1 {
      font-size: 50px;
      text-shadow: 10px 10px 3px rgb(245, 143, 250);
    }

    .s2 {
      font-size: 100px;
      color: orange;
      text-shadow: -2px -2px 10px blue;
    }

    .s3 {
      font-size: 50px;
      color: rgba(196, 238, 248, 0.832);
      text-shadow: 5px 5px 20px rgb(245, 143, 250);
      text-decoration: line-through dotted rgb(143, 147, 250);
    }

    .s4 {
      font-size: 50px;
      color: rgba(255, 25, 44, 0.832);
      text-shadow: 3px 3px 5px rgb(206, 255, 46);
      text-decoration: underline dashed;
    }

    .s5 {
      font-size: 80px;
      color: rgba(198, 52, 242, 0.832);
      text-shadow: -5px -5px 20px rgb(0, 255, 68);
      text-decoration: underline wavy 3px rgb(124, 255, 218);
    }
  </style>
</head>

<body>
  <h1>text-shadow 속성</h1>
  <p>텍스트에 그림자 효과를 추가하는 속성</p>
  <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
  <div class="ex">
    <h2 class="s1">HTML5</h2>
    <h2 class="s2">HTML5</h2>
    <h2 class="s3">HTML5</h2>
    <h2 class="s4">HTML5</h2>
    <h2 class="s5">HTML5</h2>
  </div>
</body>

</html>
